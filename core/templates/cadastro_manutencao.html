{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/cadastro_manutencao.css' %}">
    <title>Cadastro de Manutenção</title>
</head>
<body>
    <aside class="sidebar">
       <h1 class="logo">Monitor PMPP</h1>
        <nav class="menu">
            <ul class="menu-lista">
                <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'pontos' %}">Pontos Wi-Fi</a></li>
                <li class="ativo"><a href="{% url 'manutencoes' %}">Manutenções</a></li>
                <li><a href="{% url 'usuarios' %}">Usuários</a></li>
                <li><a href="{% url 'relatorios' %}">Relatórios</a></li>
                <li><a href="#">Configurações</a></li>
                <li><a href="{% url 'logout' %}">Sair</a></li>
            </ul>
        </nav>
    </aside>
    <section class="conteudo">
        <header class="topbar">
            <h1>Nova Manutenção</h1>
            <p>Registre uma nova manutenção para um ponto Wi-Fi.</p>
        </header>
        <main class="area-formulario">
            <section class="formulario-card">
                <h2>Dados da Manutenção</h2>
                <form method="POST">
                    {% csrf_token %}
                    <section class="campo">
                        <label for="ponto">Ponto Wi-Fi</label>
                        <select id="ponto" name="ponto" required>
                            <option value="">Selecione o ponto Wi-Fi</option>
                            {% for ponto in pontos %}
                            <option value="{{ ponto.id }}">{{ ponto.codigo }} - {{ ponto.nome }}</option>
                            {% endfor %}
                        </select>
                    </section>
                    <section class="campo">
                        <label for="problema">Problema</label>
                        <input type="text" id="problema" name="problema" placeholder="Descreva o problema" required>
                    </section>
                    <section class="campo">
                        <label for="responsavel">Responsável</label>
                        <select id="responsavel" name="responsavel" required>
                            <option value="">Selecione o responsável</option>
                            {% for usuario in usuarios %}
                            <option value="{{ usuario.id }}">{{ usuario.nome }}</option>
                            {% endfor %}
                        </select>
                    </section>
                    <section class="campo">
                        <label for="data_abertura">Data de Abertura</label>
                        <input type="date" id="data_abertura" name="data_abertura" required>
                    </section>
                    <section class="campo">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="Aberta">Aberta</option>
                            <option value="Em andamento">Em andamento</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </section>
                    <section class="campo">
                        <label for="observacao">Observação</label>
                        <textarea id="observacao" name="observacao" rows="5" placeholder="Digite alguma observação..."></textarea>
                    </section>
                    <section class="botoes">
                        <button type="submit" class="salvar">Salvar Manutenção</button>
                        <a href="{% url 'manutencoes' %}"><button type="button" class="cancelar">Cancelar</button></a>
                    </section>
                </form>
            </section>
        </main>
    </section>
    <footer>
        <p>&copy; 2026 - Gov18 | Monitor PMPP</p>
    </footer>
</body>
</html>
