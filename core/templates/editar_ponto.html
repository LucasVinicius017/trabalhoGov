{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/cadastro_ponto.css' %}">
    <title>Editar Ponto Wi-Fi</title>
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">Monitor PMPP</h1>
        <nav class="menu">
            <ul class="menu-lista">
                <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                <li class="ativo"><a href="{% url 'pontos' %}">Pontos Wi-Fi</a></li>
                <li><a href="{% url 'manutencoes' %}">Manutenções</a></li>
                <li><a href="{% url 'usuarios' %}">Usuários</a></li>
                <li><a href="{% url 'relatorios' %}">Relatórios</a></li>
                <li><a href="#">Configurações</a></li>
                <li><a href="{% url 'logout' %}">Sair</a></li>
            </ul>
        </nav>
    </aside>
    <section class="conteudo">
        <header class="topbar">
            <h1>Editar Ponto Wi-Fi</h1>
            <p>Altere as informações do ponto Wi-Fi.</p>
        </header>
        <main class="area-formulario">
            <section class="formulario-card">
                <h2>Dados do Ponto Wi-Fi</h2>
                <form method="POST">
                    {% csrf_token %}
                    <section class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" name="codigo" value="{{ ponto.codigo }}" required>
                    </section>
                    <section class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" value="{{ ponto.nome }}" required>
                    </section>
                    <section class="campo">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" name="endereco" value="{{ ponto.endereco }}" required>
                    </section>
                    <section class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="{{ ponto.bairro }}" required>
                    </section>
                    <section class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="{{ ponto.cidade }}" required>
                    </section>
                    <section class="campo">
                        <label for="ip">Endereço IP</label>
                        <input type="text" id="ip" name="ip" value="{{ ponto.ip }}" required>
                    </section>
                    <section class="campo">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="Online" {% if ponto.status == "Online" %} selected {% endif %}>Online</option>
                            <option value="Offline" {% if ponto.status == "Offline" %} selected {% endif %}>Offline</option>
                            <option
                                value="Manutencao"
                                {% if ponto.status == "Manutencao" %}
                                    selected {% endif %}>Em Manutenção</option>
                        </select>
                    </section>
                    <section class="campo">
                        <label for="observacao">Observação</label>
                        <textarea id="observacao" name="observacao" rows="5">{{ ponto.observacao }}</textarea>
                    </section>
                    <section class="botoes">
                        <button type="submit" class="salvar">Salvar Alterações</button>
                        <a href="{% url 'pontos' %}">
                            <button type="button" class="cancelar">Cancelar</button></a>
                    </section>
                </form>
            </section>
        </main>
    </section>
    <footer>

    </footer>
</body>
</html>
